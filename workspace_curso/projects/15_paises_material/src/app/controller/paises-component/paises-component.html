<div class="container">
  <select class="form-control" [ngModel]="continente()" (ngModelChange)="continente.set($event)"  (change)="cargarPaises()">
    <option>-Continente-</option>
    @for(c of continentes(); track c){
        <option  value="{{c}}">{{c}}</option>
    }

  </select>
  <br><br>
  @if(paises().length>0){
  <!--
  <table class="table" border="1">
      <tr><th>Nombre pais</th><th>Continente</th><th>Población</th><th>Bandera</th></tr>
      @for(p of paises();track p){
        <tr>
            <td>{{p.name.official}}</td>
            <td>{{p.region}}</td>
            <td>{{p.population|number}}</td>
            <td><img src="{{p.flags.png}}" width="30px" height="20px" loading="lazy"></td>
        </tr>
      }

    </table>
    -->
    <div id="paises" class="page">
        <h2>
          Paises
        </h2>
        <table  mat-table [dataSource]="dataSource" matSort matSortActive matSortDirection="asc" class="mat-elevation-z8">
                <ng-container matColumnDef="Pais">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                  <td mat-cell *matCellDef="let m">{{m.name.official}}</td>
                </ng-container>
                <ng-container matColumnDef="Continente">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
                  <td mat-cell *matCellDef="let m">{{ m.region }}</td>
                </ng-container>
                <ng-container matColumnDef="Poblacion">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Nota</th>
                  <td mat-cell *matCellDef="let m">{{ m.population|number }}</td>
                </ng-container>
                <ng-container matColumnDef="Bandera">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Curso</th>
                  <td mat-cell *matCellDef="let m"><img src="{{m.flags.png}}" width="30px" height="20px" loading="lazy"></td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator [pageSize]="5" [pageSizeOptions]="[2, 5, 10]" showFirstLastButtons></mat-paginator>

    </div>
  }

</div>
